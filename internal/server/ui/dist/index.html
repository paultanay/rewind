<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rewind — Incident Timeline</title>
<style>
  :root {
    --bg:        #0d1117;
    --surface:   #161b22;
    --border:    #30363d;
    --text:      #e6edf3;
    --muted:     #8b949e;
    --accent:    #58a6ff;
    --critical:  #f85149;
    --notable:   #d29922;
    --info:      #3fb950;
    --high:      #f78166;
    --medium:    #e3b341;
    --low:       #79c0ff;
    --font:      system-ui, -apple-system, 'Segoe UI', sans-serif;
    --mono:      'Courier New', 'Cascadia Code', monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: var(--font);
         font-size: 14px; line-height: 1.6; min-height: 100vh; }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }

  /* ── Layout ── */
  #app { display: grid; grid-template-rows: 56px 1fr; min-height: 100vh; }
  header { background: var(--surface); border-bottom: 1px solid var(--border);
           display: flex; align-items: center; gap: 16px; padding: 0 24px;
           position: sticky; top: 0; z-index: 100; }
  header h1 { font-size: 18px; font-weight: 700; letter-spacing: -.5px; color: var(--text); }
  header .badge { background: var(--accent); color: #000; font-size: 11px;
                  font-weight: 700; padding: 2px 8px; border-radius: 12px; }
  #meta { margin-left: auto; display: flex; gap: 16px; align-items: center; color: var(--muted); font-size: 13px; }

  main { display: grid; grid-template-columns: 320px 1fr; overflow: hidden; height: calc(100vh - 56px); }

  /* ── Sidebar ── */
  aside { border-right: 1px solid var(--border); overflow-y: auto;
          padding: 20px 16px; display: flex; flex-direction: column; gap: 16px; }
  .card { background: var(--surface); border: 1px solid var(--border);
          border-radius: 8px; padding: 16px; }
  .card h2 { font-size: 11px; text-transform: uppercase; letter-spacing: .8px;
              color: var(--muted); margin-bottom: 12px; font-weight: 600; }

  /* Verdict card */
  .verdict-confidence { font-size: 24px; font-weight: 800; margin-bottom: 6px; }
  .verdict-confidence.HIGH   { color: var(--high); }
  .verdict-confidence.MEDIUM { color: var(--medium); }
  .verdict-confidence.LOW, .verdict-confidence.SPECULATIVE { color: var(--low); }
  .verdict-trigger { font-size: 13px; color: var(--text); line-height: 1.5; margin-bottom: 4px; }
  .verdict-explanation { font-size: 12px; color: var(--muted); line-height: 1.5; }
  .verdict-score { font-size: 11px; color: var(--muted); margin-top: 8px;
                   font-family: var(--mono); }

  /* Hypothesis list */
  .hypothesis { padding: 10px 12px; border-radius: 6px; background: var(--bg);
                border: 1px solid var(--border); margin-bottom: 8px; cursor: pointer;
                transition: border-color .15s; }
  .hypothesis:hover { border-color: var(--accent); }
  .hypothesis.selected { border-color: var(--accent); background: rgba(88,166,255,.06); }
  .hyp-header { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
  .hyp-rules { font-size: 11px; font-weight: 700; color: var(--muted);
               font-family: var(--mono); }
  .hyp-conf { font-size: 11px; font-weight: 700; padding: 2px 7px; border-radius: 10px; margin-left: auto; }
  .hyp-conf.HIGH   { background: rgba(248,81,73,.18); color: var(--high); }
  .hyp-conf.MEDIUM { background: rgba(227,179,65,.18); color: var(--medium); }
  .hyp-conf.SPECULATIVE, .hyp-conf.LOW { background: rgba(121,192,255,.15); color: var(--low); }
  .hyp-trigger { font-size: 12px; color: var(--text); }
  .hyp-score { font-size: 11px; color: var(--muted); margin-top: 4px;
               font-family: var(--mono); }

  /* Chain links */
  .chain { margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--border); display: none; }
  .hypothesis.selected .chain { display: block; }
  .chain-link { font-size: 11px; color: var(--muted); padding: 2px 0;
                padding-left: 12px; position: relative; }
  .chain-link::before { content: '→'; position: absolute; left: 0; color: var(--accent); }

  /* Source list */
  .source { display: flex; align-items: center; gap: 8px; font-size: 13px;
            padding: 5px 0; border-bottom: 1px solid var(--border); }
  .source:last-child { border-bottom: none; }
  .dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  .dot.ok { background: var(--info); }
  .dot.failed { background: var(--critical); }
  .dot.partial { background: var(--notable); }
  .dot.skipped { background: var(--muted); }
  .src-counts { margin-left: auto; font-size: 11px; color: var(--muted);
                font-family: var(--mono); }

  /* ── Timeline panel ── */
  section#timeline { overflow-y: auto; padding: 20px 24px; }
  #timeline-header { font-size: 11px; text-transform: uppercase; letter-spacing: .8px;
                     color: var(--muted); margin-bottom: 16px; font-weight: 600; }
  .event { display: grid; grid-template-columns: 64px 24px 1fr;
           gap: 0 10px; margin-bottom: 2px; align-items: start; }
  .event-time { font-family: var(--mono); font-size: 12px; color: var(--muted);
                padding-top: 9px; text-align: right; line-height: 1; }
  .event-line { display: flex; flex-direction: column; align-items: center; padding-top: 9px; }
  .event-dot  { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0;
                border: 2px solid var(--border); background: var(--bg); }
  .event-dot.CRITICAL { border-color: var(--critical); background: var(--critical); }
  .event-dot.NOTABLE  { border-color: var(--notable);  background: var(--notable); }
  .event-dot.INFO     { border-color: var(--info);     background: var(--info); }
  .event-connector { width: 2px; background: var(--border); flex: 1; min-height: 8px; }
  .event-body { padding: 8px 12px; border-radius: 6px; background: var(--surface);
                border: 1px solid var(--border); margin-bottom: 2px;
                border-left: 3px solid var(--border); }
  .event-body.CRITICAL  { border-left-color: var(--critical); }
  .event-body.NOTABLE   { border-left-color: var(--notable); }
  .event-body.INFO      { border-left-color: var(--info); }
  .event-header { display: flex; align-items: baseline; gap: 8px; }
  .event-kind { font-size: 11px; font-family: var(--mono); color: var(--muted);
                text-transform: uppercase; flex-shrink: 0; }
  .event-title { font-size: 13px; font-weight: 600; color: var(--text); }
  .event-entity { font-size: 11px; color: var(--accent); font-family: var(--mono); margin-top: 2px; }
  .event-detail { font-size: 12px; color: var(--muted); margin-top: 8px;
                  font-family: var(--mono); white-space: pre-wrap;
                  background: var(--bg); padding: 8px 10px; border-radius: 4px;
                  max-height: 140px; overflow-y: auto; display: none; }
  .event-body:hover .event-detail { display: block; }
  .event-src { font-size: 11px; color: var(--muted); margin-top: 4px; }

  /* Loading / error */
  .state { display: flex; align-items: center; justify-content: center;
           height: 50vh; flex-direction: column; gap: 16px; color: var(--muted); }
  .spinner { width: 32px; height: 32px; border: 3px solid var(--border);
             border-top-color: var(--accent); border-radius: 50%;
             animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* No-verdict */
  .no-verdict { padding: 12px; border-radius: 6px; background: var(--bg);
                border: 1px solid var(--border); color: var(--muted); font-size: 13px; }

  /* Window pill */
  .window-pill { background: var(--bg); border: 1px solid var(--border);
                 border-radius: 6px; padding: 8px 12px; font-size: 12px;
                 font-family: var(--mono); color: var(--muted); }
  .window-pill span { color: var(--text); }

  /* Anomaly */
  .anomaly-item { font-size: 12px; padding: 5px 8px; border-radius: 4px;
                  background: var(--bg); border: 1px solid var(--border);
                  margin-bottom: 5px; font-family: var(--mono); color: var(--muted); }

  @media (max-width: 900px) {
    main { grid-template-columns: 1fr; height: auto; }
    aside { border-right: none; border-bottom: 1px solid var(--border); max-height: 55vh; }
    section#timeline { height: auto; }
  }
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>⏪ rewind</h1>
    <span class="badge">Incident Timeline</span>
    <div id="meta">Loading…</div>
  </header>
  <main>
    <aside id="sidebar"><div class="state"><div class="spinner"></div></div></aside>
    <section id="timeline"><div class="state"><div class="spinner"></div></div></section>
  </main>
</div>

<script>
'use strict';

const API = '/api/incident';

// Map Go model event kinds to display emoji.
const KIND_ICON = {
  'Deploy':         '🚀',
  'ConfigChange':   '⚙️',
  'Restart':        '🔄',
  'OOMKill':        '💀',
  'CrashLoop':      '💥',
  'ProbeFailed':    '🩺',
  'PodKilled':      '☠️',
  'NodePressure':   '🖥️',
  'LogBurst':       '📋',
  'TraceErrorSpike':'🔭',
  'AlertFired':     '🔔',
  'AlertResolved':  '✅',
  'Anomaly':        '📈',
};
const DEFAULT_ICON = '📌';
const SEV_COLOR = { CRITICAL: 'var(--critical)', NOTABLE: 'var(--notable)', INFO: 'var(--info)' };

// ── Data loading ──────────────────────────────────────────────────────────────

async function load() {
  try {
    const r = await fetch(API);
    if (!r.ok) throw new Error('HTTP ' + r.status + ' from /api/incident');
    const inc = await r.json();
    render(inc);
  } catch (e) {
    showError(e.message);
  }
}

function showError(msg) {
  document.getElementById('sidebar').innerHTML =
    '<div class="state"><p>Error: ' + esc(msg) + '</p></div>';
  document.getElementById('timeline').innerHTML =
    '<div class="state"><p>Check that <code>rewind ui</code> is running correctly.</p></div>';
}

// ── Formatters ────────────────────────────────────────────────────────────────

function fmtFull(iso) {
  if (!iso) return '—';
  return new Date(iso).toISOString().replace('T', ' ').replace(/\.\d+Z$/, ' UTC');
}

function fmtTime(iso) {
  if (!iso) return '—';
  return new Date(iso).toISOString().substr(11, 8);
}

function esc(s) {
  if (s == null) return '';
  return String(s)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

// ── Event lookup by ID ────────────────────────────────────────────────────────

function buildEventIndex(events) {
  const idx = {};
  (events || []).forEach(ev => { idx[ev.id] = ev; });
  return idx;
}

// ── Render ────────────────────────────────────────────────────────────────────

let _inc = null; // stored for hypothesis selection

function render(inc) {
  _inc = inc;
  renderMeta(inc);
  renderSidebar(inc, buildEventIndex(inc.events));
  renderTimeline(inc);
}

function renderMeta(inc) {
  const from = fmtTime(inc.window && inc.window.from);
  const to   = fmtTime(inc.window && inc.window.to);
  document.getElementById('meta').innerHTML =
    '<span class="window-pill"><span>' + from + '</span> → <span>' + to + '</span></span>' +
    '<span style="color:var(--muted)">' + esc(inc.id || '—') + '</span>';
  document.title = 'rewind — ' + from + ' → ' + to;
}

function renderSidebar(inc, evIdx) {
  const v = inc.verdict;
  let html = '';

  // Window card
  html += '<div class="card"><h2>Investigation Window</h2>' +
    '<div class="window-pill"><span>' + esc(fmtFull(inc.window && inc.window.from)) + '</span><br>→ <span>' +
    esc(fmtFull(inc.window && inc.window.to)) + '</span></div></div>';

  // Verdict card
  if (v && v.hypotheses && v.hypotheses.length) {
    const top = v.hypotheses[0];
    const triggerEv = evIdx[top.triggerEventId];
    const triggerTitle = triggerEv ? triggerEv.title : (top.triggerEventId || '—');
    const rules = (top.ruleIds || []).join(', ') || '—';
    const conf  = top.confidence || 'SPECULATIVE';

    html += '<div class="card"><h2>Verdict</h2>' +
      '<div class="verdict-confidence ' + conf + '">' + conf + '</div>' +
      '<div class="verdict-trigger">Trigger: ' + esc(triggerTitle) + '</div>' +
      '<div class="verdict-explanation">' + esc(top.explanation || '') + '</div>' +
      '<div class="verdict-score">score ' + (top.score || 0).toFixed(3) + ' · ' + esc(rules) + '</div>' +
      '</div>';

    // Hypotheses list
    html += '<div class="card"><h2>Hypotheses (' + v.hypotheses.length + ')</h2>';
    v.hypotheses.forEach(function(h, i) {
      const tEv = evIdx[h.triggerEventId];
      const tTitle = tEv ? tEv.title : (h.triggerEventId || '—');
      const hRules = (h.ruleIds || []).join(', ') || '—';
      const hConf  = h.confidence || 'SPECULATIVE';

      // Build chain HTML
      let chainHtml = '';
      if (h.chain && h.chain.length) {
        chainHtml = '<div class="chain">';
        h.chain.forEach(function(link) {
          chainHtml += '<div class="chain-link">' + esc(link.description || link.ruleId || '') + '</div>';
        });
        chainHtml += '</div>';
      }

      html += '<div class="hypothesis' + (i === 0 ? ' selected' : '') +
        '" onclick="selectHyp(' + i + ')">' +
        '<div class="hyp-header"><span class="hyp-rules">' + esc(hRules) + '</span>' +
        '<span class="hyp-conf ' + hConf + '">' + hConf + '</span></div>' +
        '<div class="hyp-trigger">' + esc(tTitle) + '</div>' +
        '<div class="hyp-score">score ' + (h.score || 0).toFixed(3) + '</div>' +
        chainHtml +
        '</div>';
    });
    html += '</div>';

    // Notable anomalies
    if (v.notableAnomalies && v.notableAnomalies.length) {
      html += '<div class="card"><h2>Notable Anomalies</h2>';
      v.notableAnomalies.forEach(function(a) {
        html += '<div class="anomaly-item">' + esc(a) + '</div>';
      });
      html += '</div>';
    }
  } else if (v && v.noTriggerFound) {
    html += '<div class="card"><h2>Verdict</h2>' +
      '<div class="no-verdict">No clear trigger identified.<br>' +
      '<span style="font-size:12px">Insufficient correlated signals — check sources and window.</span></div></div>';
  } else {
    html += '<div class="card"><h2>Verdict</h2>' +
      '<div class="no-verdict">Analysis did not find a causal chain above threshold.</div></div>';
  }

  // Sources
  if (inc.sources && inc.sources.length) {
    html += '<div class="card"><h2>Sources (' + inc.sources.length + ')</h2>';
    inc.sources.forEach(function(s) {
      const cls = s.status === 'ok' ? 'ok' : s.status === 'failed' ? 'failed' :
                  s.status === 'partial' ? 'partial' : 'skipped';
      html += '<div class="source"><span class="dot ' + cls + '"></span>' +
        '<span>' + esc(s.name) + '</span>' +
        '<span class="src-counts">' + (s.eventCount || 0) + 'evt&nbsp;' + (s.signalCount || 0) + 'sig</span>' +
        '</div>';
    });
    html += '</div>';
  }

  // Meta
  if (inc.meta) {
    html += '<div class="card"><h2>Generated by</h2>' +
      '<div style="font-size:12px;color:var(--muted);font-family:var(--mono)">' +
      'rewind ' + esc(inc.meta.rewindVersion || 'dev') + '<br>' +
      esc(fmtFull(inc.meta.createdAt)) + '</div></div>';
  }

  document.getElementById('sidebar').innerHTML = html;
}

function renderTimeline(inc) {
  const events = (inc.events || []).slice().sort(function(a, b) {
    return a.at < b.at ? -1 : 1;
  });

  let html = '<div id="timeline-header">Event Timeline (' + events.length + ' events)</div>';

  if (!events.length) {
    html += '<div class="state"><p>No events collected in this window.</p></div>';
    document.getElementById('timeline').innerHTML = html;
    return;
  }

  events.forEach(function(ev, i) {
    const icon   = KIND_ICON[ev.kind] || DEFAULT_ICON;
    const sev    = ev.severity || 'INFO';
    const detail = ev.detail
      ? '<div class="event-detail">' + esc(ev.detail) + '</div>'
      : '';
    const src = ev.sourceRef;
    const srcHtml = src
      ? (src.url
          ? '<a href="' + esc(src.url) + '" target="_blank" rel="noopener">' + esc(src.sourceName) + ' ↗</a>'
          : esc(src.sourceName || ''))
      : '';
    const entityHtml = ev.entityId
      ? '<div class="event-entity">' + esc(ev.entityId) + '</div>'
      : '';

    const connector = (i < events.length - 1)
      ? '<div class="event-connector"></div>'
      : '';

    html +=
      '<div class="event">' +
        '<div class="event-time">' + fmtTime(ev.at) + '</div>' +
        '<div class="event-line"><div class="event-dot ' + sev + '"></div>' + connector + '</div>' +
        '<div class="event-body ' + sev + '">' +
          '<div class="event-header">' +
            '<span class="event-kind">' + esc(ev.kind) + '</span>' +
            '<span class="event-icon">' + icon + '</span>' +
            '<span class="event-title">' + esc(ev.title || ev.kind) + '</span>' +
          '</div>' +
          entityHtml +
          (srcHtml ? '<div class="event-src">' + srcHtml + '</div>' : '') +
          detail +
        '</div>' +
      '</div>';
  });

  document.getElementById('timeline').innerHTML = html;
}

// ── Hypothesis selection ──────────────────────────────────────────────────────

function selectHyp(i) {
  document.querySelectorAll('.hypothesis').forEach(function(el, j) {
    el.classList.toggle('selected', j === i);
  });
}

// ── Boot ──────────────────────────────────────────────────────────────────────

load();
</script>
</body>
</html>
