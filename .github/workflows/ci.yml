name: CI

on:
  push:
    branches: ["main", "release/**"]
    tags: ["v*"]
  pull_request:
    branches: ["main"]

permissions:
  contents: write
  packages: write

env:
  GO_VERSION: "1.22"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: v1.61
          args: --timeout 5m

  test:
    name: Test (Go ${{ matrix.go }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        go: ["1.22", "1.23", "1.24"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          cache: true
      # Race detector requires CGO (gcc). Linux/macOS runners have gcc; Windows runners do not.
      - name: Run tests with race detector
        if: runner.os != 'Windows'
        run: go test -race -count=1 -timeout=120s ./...
      - name: Run tests (Windows)
        if: runner.os == 'Windows'
        run: go test -count=1 -timeout=120s ./...
      - name: Check coverage
        if: matrix.os == 'ubuntu-latest' && matrix.go == '1.22'
        run: |
          go test -coverprofile=coverage.out \
            ./internal/model/... \
            ./internal/analyze/... \
            ./internal/bundle/...
          go tool cover -func=coverage.out | \
            awk '/total:/ { if ($3+0 < 60) { print "Coverage " $3 " < 60%"; exit 1 } }'

  build:
    name: Build
    needs: [lint, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Build all platforms
        run: |
          GOOS=linux   GOARCH=amd64  go build -o /dev/null ./cmd/rewind
          GOOS=linux   GOARCH=arm64  go build -o /dev/null ./cmd/rewind
          GOOS=darwin  GOARCH=amd64  go build -o /dev/null ./cmd/rewind
          GOOS=darwin  GOARCH=arm64  go build -o /dev/null ./cmd/rewind
          GOOS=windows GOARCH=amd64  go build -o /dev/null ./cmd/rewind
      - name: Smoke-test demo
        run: go run ./cmd/rewind demo --scenario false-positive; true

  release:
    name: Release
    needs: [build]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Run goreleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
