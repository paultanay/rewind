<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 250" role="img" aria-labelledby="title desc">
  <title id="title">Rewind investigation workflow</title>
  <desc id="desc">Review context, source health, assessment, timeline evidence, and human conclusion.</desc>
  <style>text{font-family:Inter,Arial,sans-serif;fill:#e8eef4}.label{font-size:14px;font-weight:700}.small{font-size:11px;fill:#b0bfcc}.box{fill:#131e29;stroke:#385066;stroke-width:2}.line{stroke:#58d3c7;stroke-width:2;fill:none;marker-end:url(#arrow)}.num{fill:#58d3c7}</style>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" class="num"/></marker></defs>
  <rect width="1120" height="250" rx="20" fill="#0b1118"/><text x="36" y="42" class="label">A reviewable path from raw evidence to a human decision</text>
  <g transform="translate(36 78)"><rect width="172" height="106" rx="10" class="box"/><circle cx="24" cy="26" r="12" class="num"/><text x="20" y="30" fill="#0b1118" font-size="12">1</text><text x="48" y="31" class="label">Confirm context</text><text x="18" y="62" class="small">Window, scope, incident ID</text><text x="18" y="80" class="small">and collection boundary</text></g>
  <g transform="translate(244 78)"><rect width="172" height="106" rx="10" class="box"/><circle cx="24" cy="26" r="12" class="num"/><text x="20" y="30" fill="#0b1118" font-size="12">2</text><text x="48" y="31" class="label">Check coverage</text><text x="18" y="62" class="small">Available, partial, failed,</text><text x="18" y="80" class="small">or skipped sources</text></g>
  <g transform="translate(452 78)"><rect width="172" height="106" rx="10" class="box"/><circle cx="24" cy="26" r="12" class="num"/><text x="20" y="30" fill="#0b1118" font-size="12">3</text><text x="48" y="31" class="label">Read ranking</text><text x="18" y="62" class="small">Trigger, confidence, rule</text><text x="18" y="80" class="small">chain, and limitations</text></g>
  <g transform="translate(660 78)"><rect width="172" height="106" rx="10" class="box"/><circle cx="24" cy="26" r="12" class="num"/><text x="20" y="30" fill="#0b1118" font-size="12">4</text><text x="48" y="31" class="label">Inspect evidence</text><text x="18" y="62" class="small">Replay time, entity, source,</text><text x="18" y="80" class="small">raw detail, and signal</text></g>
  <g transform="translate(868 78)"><rect width="216" height="106" rx="10" class="box"/><circle cx="24" cy="26" r="12" class="num"/><text x="20" y="30" fill="#0b1118" font-size="12">5</text><text x="48" y="31" class="label">Write conclusion</text><text x="18" y="62" class="small">Record gaps, alternatives,</text><text x="18" y="80" class="small">and next validation steps</text></g>
  <path d="M208 131h36M416 131h36M624 131h36M832 131h36" class="line"/>
</svg>
