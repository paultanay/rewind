# golangci-lint v2 configuration for Rewind.
# Run locally: golangci-lint run ./...

version: "2"

run:
  timeout: 5m
  modules-download-mode: readonly

linters:
  default: none
  enable:
    - errcheck
    - govet
    - staticcheck
    - gosec
    - misspell
    - bodyclose
    - whitespace

  settings:
    errcheck:
      # Close() errors on HTTP bodies and file handles are rarely actionable.
      exclude-functions:
        - (io.ReadCloser).Close
        - (io.Closer).Close
        - (*os.File).Close
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
        - (github.com/fatih/color.Color).Fprint
        - (github.com/fatih/color.Color).Fprintf
        - (github.com/fatih/color.Color).Fprintln
        - (*github.com/fatih/color.Color).Fprint
        - (*github.com/fatih/color.Color).Fprintf
        - (*github.com/fatih/color.Color).Fprintln

    govet:
      # Disable analysers that are informational or too noisy for this alpha.
      disable:
        - fieldalignment
        - shadow

    gosec:
      excludes:
        - G304 # caller-selected path is required for bundle I/O
        - G115 # safe integer conversions are bounded by Go collection sizes

    misspell:
      locale: US

  exclusions:
    generated: lax
    rules:
      # Test helpers don't need security hardening or full error handling.
      - path: "_test\\.go"
        linters:
          - gosec
          - errcheck

formatters:
  enable:
    - gofmt
    - goimports

  exclusions:
    generated: lax
