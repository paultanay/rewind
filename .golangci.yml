# golangci-lint configuration for Rewind.
# Run locally: golangci-lint run ./...

run:
  timeout: 5m
  modules-download-mode: readonly

linters:
  disable-all: true
  enable:
    - errcheck       # unhandled errors
    - govet          # go vet
    - staticcheck    # advanced static analysis
    - revive         # opinionated style (replaces golint)
    - gosec          # security patterns
    - misspell       # comment/string spell check
    - gofmt          # formatting
    - goimports      # import ordering
    - bodyclose      # unclosed HTTP response bodies
    - whitespace     # leading/trailing blank lines in blocks

linters-settings:
  govet:
    enable-all: true
    disable:
      - fieldalignment  # useful but too noisy for initial release

  revive:
    rules:
      - name: exported
        arguments:
          - disableStutteringCheck

  gosec:
    excludes:
      - G304  # file path from variable — intentional in bundle I/O

  misspell:
    locale: US

issues:
  max-same-issues: 0
  exclude-rules:
    # Test helpers don't need error wrapping or security hardening.
    - path: "_test\\.go"
      linters:
        - gosec
        - errcheck

    # Embedded UI assets are not Go source.
    - path: "server/ui/"
      linters:
        - all
