# golangci-lint configuration for Rewind.
# Run locally: golangci-lint run ./...

run:
  timeout: 5m
  modules-download-mode: readonly

linters:
  disable-all: true
  enable:
    - errcheck      # unhandled errors
    - govet         # standard go vet (sans shadow / fieldalignment)
    - staticcheck   # advanced static analysis (SA*, S*, QF*)
    - gosec         # security anti-patterns
    - misspell      # spell-check in comments and strings
    - gofmt         # formatting
    - goimports     # import ordering
    - bodyclose     # unclosed HTTP response bodies
    - whitespace    # spurious blank lines inside blocks

linters-settings:
  errcheck:
    # Close() errors on HTTP bodies and file handles are rarely actionable.
    exclude-functions:
      - (io.ReadCloser).Close
      - (io.Closer).Close
      - (*os.File).Close

  govet:
    # Disable analysers that are too noisy for an initial release.
    disable:
      - fieldalignment  # struct field reordering — informational only
      - shadow          # variable shadowing — too many false positives

  gosec:
    excludes:
      - G304  # file inclusion via variable — intentional in bundle I/O
      - G115  # uint-to-int conversion — false positive in range loops

  misspell:
    locale: US

issues:
  max-same-issues: 0
  exclude-rules:
    # Test files don't need security hardening or full error handling.
    - path: "_test\\.go"
      linters:
        - gosec
        - errcheck

    # Embedded UI static assets are not Go source.
    - path: "server/ui/"
      linters:
        - all
