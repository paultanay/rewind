<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">Rewind incident workspace preview</title>
  <desc id="desc">A restrained incident review console with a neutral surface, indigo focus color, incident context, source health, replay controls, and evidence inspection.</desc>
  <style>text{font-family:Inter,Arial,sans-serif;fill:#202a35}.tiny{font-size:11px;fill:#7b8794}.small{font-size:13px;fill:#52606d}.label{font-size:16px;font-weight:650}.mono{font-family:Consolas,monospace;font-size:12px;fill:#52606d}.box{fill:#fff;stroke:#dfe4ea}.indigo{fill:#4055a8}.blue{fill:#2f5fa7}.warn{fill:#9a5a00}.red{fill:#b42318}.muted{fill:#f1f4f7}</style>
  <rect width="1200" height="650" rx="12" fill="#f4f6f8"/><rect x="0" y="0" width="1200" height="64" fill="#fff"/><path d="M25 31h17a8 8 0 1 1 0 16H33m0 0 5-5m-5 5 5 5M55 49H38a8 8 0 1 1 0-16h9m0 0-5-5m5 5-5 5" stroke="#4055a8" stroke-width="2" fill="none" stroke-linecap="round"/><text x="78" y="34" class="label" letter-spacing="2">REWIND</text><text x="78" y="51" class="tiny">incident evidence workspace</text><path d="M1030 27h130" stroke="#dfe4ea"/><text x="1030" y="48" class="tiny">offline analysis</text>
