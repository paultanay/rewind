# goreleaser configuration for Rewind.
# Release: goreleaser release --clean
# Docs: https://goreleaser.com/customization/
version: 2

before:
  hooks:
    - go mod tidy
    - go mod verify

builds:
  - id: rewind
    main: ./cmd/rewind
    binary: rewind
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w
      - -X github.com/paultanay/rewind/internal/cli.rewindVersion={{.Version}}
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      # Windows ARM64 cross-compile is unsupported in the Go stdlib net package
      # without CGO. Enable when the Go stdlib resolves this.
      - goos: windows
        goarch: arm64

archives:
  - id: rewind-archive
    name_template: "rewind_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        format: zip
    files:
      - LICENSE
      - README.md
      - docs/**

checksum:
  name_template: "checksums.txt"
  algorithm: sha256

changelog:
  sort: asc
  use: github
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "Merge pull request"
      - "Merge branch"
  groups:
    - title: Features
      regexp: "^feat"
      order: 0
    - title: Bug fixes
      regexp: "^fix"
      order: 1
    - title: Other
      order: 999

release:
  github:
    owner: paultanay
    name: rewind
  draft: false
  prerelease: auto
  name_template: "{{.ProjectName}} v{{.Version}}"

dockers:
  - image_templates:
      - "ghcr.io/paultanay/rewind:{{ .Tag }}-amd64"
    use: buildx
    build_flag_templates:
      - "--platform=linux/amd64"
      - "--label=org.opencontainers.image.created={{.Date}}"
      - "--label=org.opencontainers.image.title={{.ProjectName}}"
      - "--label=org.opencontainers.image.revision={{.FullCommit}}"
      - "--label=org.opencontainers.image.version={{.Version}}"
    dockerfile: Dockerfile
