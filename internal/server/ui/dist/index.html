<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rewind — Incident Replay</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:       #0d1117;
      --surface:  #161b22;
      --border:   #30363d;
      --text:     #e6edf3;
      --muted:    #8b949e;
      --accent:   #58a6ff;
      --red:      #f85149;
      --yellow:   #d29922;
      --green:    #3fb950;
      --purple:   #bc8cff;
      --sidebar-w: 320px;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      font-size: 14px;
      line-height: 1.5;
      min-height: 100vh;
    }

    /* ── Layout ── */
    #app { display: flex; height: 100vh; overflow: hidden; }
    #sidebar {
      width: var(--sidebar-w);
      min-width: var(--sidebar-w);
      background: var(--surface);
      border-right: 1px solid var(--border);
      overflow-y: auto;
      display: flex;
      flex-direction: column;
    }
    #main { flex: 1; overflow-y: auto; padding: 24px 32px; }

    /* ── Sidebar ── */
    .sidebar-header {
      padding: 20px 20px 16px;
      border-bottom: 1px solid var(--border);
    }
    .sidebar-header .logo {
      font-size: 18px;
      font-weight: 700;
      letter-spacing: -0.3px;
      color: var(--accent);
    }
    .sidebar-header .logo span { color: var(--muted); font-weight: 400; }
    .incident-id {
      font-size: 11px;
      color: var(--muted);
      margin-top: 4px;
      font-family: "SFMono-Regular", Consolas, monospace;
    }

    .sidebar-section { padding: 16px 20px; border-bottom: 1px solid var(--border); }
    .sidebar-section h3 {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      color: var(--muted);
      margin-bottom: 10px;
    }

    /* ── Verdict card ── */
    .verdict-card {
      border-radius: 8px;
      border: 1px solid var(--border);
      overflow: hidden;
    }
    .verdict-header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 14px;
      background: rgba(88, 166, 255, 0.06);
      border-bottom: 1px solid var(--border);
    }
    .confidence-badge {
      font-size: 11px;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 20px;
      text-transform: uppercase;
      letter-spacing: 0.4px;
    }
    .conf-high   { background: rgba(63,185,80,0.15);  color: var(--green); }
    .conf-medium { background: rgba(210,153,34,0.15); color: var(--yellow); }
    .conf-low,
    .conf-speculative { background: rgba(139,148,158,0.15); color: var(--muted); }
    .conf-none   { background: rgba(139,148,158,0.1); color: var(--muted); }

    .verdict-body { padding: 12px 14px; }
    .trigger-label { font-size: 11px; color: var(--muted); margin-bottom: 4px; }
    .trigger-title { font-size: 13px; font-weight: 600; color: var(--text); }
    .verdict-explanation {
      margin-top: 8px;
      font-size: 12px;
      color: var(--muted);
      line-height: 1.5;
    }
    .rules-row {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      margin-top: 10px;
    }
    .rule-chip {
      font-size: 11px;
      font-family: "SFMono-Regular", Consolas, monospace;
      padding: 2px 6px;
      border-radius: 4px;
      background: rgba(188,140,255,0.12);
      color: var(--purple);
    }

    .chain-list { margin-top: 10px; list-style: none; }
    .chain-list li {
      position: relative;
      padding-left: 18px;
      font-size: 12px;
      color: var(--muted);
      margin-top: 4px;
    }
    .chain-list li::before {
      content: "→";
      position: absolute;
      left: 0;
      color: var(--accent);
    }

    .no-verdict {
      padding: 16px 14px;
      font-size: 12px;
      color: var(--muted);
    }

    /* ── Sources ── */
    .source-row {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      padding: 4px 0;
    }
    .src-dot {
      width: 7px; height: 7px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .src-ok      { background: var(--green); }
    .src-err     { background: var(--red); }
    .src-timeout { background: var(--yellow); }
    .src-name    { color: var(--text); flex: 1; }
    .src-counts  { color: var(--muted); font-size: 11px; }

    /* ── Main content ── */
    h1.page-title {
      font-size: 22px;
      font-weight: 700;
      margin-bottom: 4px;
    }
    .window-line {
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 24px;
      font-family: "SFMono-Regular", Consolas, monospace;
    }

    /* ── Timeline ── */
    .section-title {
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 14px;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--border);
    }

    .timeline { list-style: none; }
    .tl-item {
      display: flex;
      gap: 14px;
      padding: 10px 0;
      border-bottom: 1px solid rgba(48,54,61,0.5);
    }
    .tl-item:last-child { border-bottom: none; }

    .tl-time {
      font-size: 12px;
      color: var(--muted);
      font-family: "SFMono-Regular", Consolas, monospace;
      min-width: 62px;
      padding-top: 2px;
    }
    .tl-icon {
      font-size: 15px;
      min-width: 20px;
      text-align: center;
      padding-top: 1px;
    }
    .tl-body { flex: 1; min-width: 0; }
    .tl-title {
      font-size: 13px;
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .tl-entity {
      font-size: 11px;
      color: var(--muted);
      font-family: "SFMono-Regular", Consolas, monospace;
      margin-top: 2px;
    }
    .tl-detail {
      font-size: 12px;
      color: var(--muted);
      margin-top: 3px;
    }
    .sev-critical { color: var(--red); }
    .sev-notable  { color: var(--yellow); }
    .sev-info     { color: var(--muted); }

    /* ── Anomalies section ── */
    .anomaly-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 12px;
      margin-bottom: 32px;
    }
    .anomaly-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 14px;
    }
    .anomaly-metric {
      font-size: 11px;
      font-family: "SFMono-Regular", Consolas, monospace;
      color: var(--accent);
      margin-bottom: 4px;
    }
    .anomaly-entity {
      font-size: 11px;
      color: var(--muted);
      margin-bottom: 8px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .anomaly-stats {
      display: flex;
      gap: 14px;
    }
    .anomaly-stat { font-size: 12px; color: var(--muted); }
    .anomaly-stat strong { color: var(--text); }

    /* ── Loading / error ── */
    .status-screen {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      gap: 12px;
      color: var(--muted);
    }
    .status-screen .icon { font-size: 36px; }
    .status-screen p { font-size: 14px; }
  </style>
</head>
<body>
<div id="app">
  <nav id="sidebar">
    <div class="sidebar-header">
      <div class="logo">⏪ rewind<span> ui</span></div>
      <div class="incident-id" id="sb-id">loading…</div>
    </div>

    <div class="sidebar-section">
      <h3>Verdict</h3>
      <div id="sb-verdict"><div class="no-verdict">Loading…</div></div>
    </div>

    <div class="sidebar-section">
      <h3>Sources</h3>
      <div id="sb-sources"></div>
    </div>
  </nav>

  <main id="main">
    <div class="status-screen" id="loading-screen">
      <div class="icon">⏳</div>
      <p>Loading incident data…</p>
    </div>
    <div id="content" style="display:none">
      <h1 class="page-title" id="main-title">Incident</h1>
      <div class="window-line" id="main-window"></div>

      <div id="anomalies-section" style="display:none">
        <div class="section-title">Signal anomalies</div>
        <div class="anomaly-grid" id="anomaly-grid"></div>
      </div>

      <div class="section-title">Event timeline</div>
      <ul class="timeline" id="timeline"></ul>
    </div>
    <div class="status-screen" id="error-screen" style="display:none">
      <div class="icon">⚠️</div>
      <p id="error-msg">Failed to load incident data.</p>
    </div>
  </main>
</div>

<script>
(function () {
  // ── Utilities ──────────────────────────────────────────────────────────────
  function fmtTime(iso) {
    try {
      const d = new Date(iso);
      return d.toISOString().slice(11, 19) + ' UTC';
    } catch { return iso; }
  }

  function severityClass(sev) {
    const s = (sev || '').toLowerCase();
    if (s === 'critical') return 'sev-critical';
    if (s === 'notable')  return 'sev-notable';
    return 'sev-info';
  }

  function kindIcon(kind) {
    const icons = {
      deploy: '🚀', configchange: '⚙️', oomkill: '💥', restart: '🔄',
      podkilled: '🗑️', nodepressure: '📦', alertfired: '🔔',
      alertresolved: '✅', logburst: '📋', traceerrorspike: '📡',
      crashloop: '🔁',
    };
    return icons[(kind || '').toLowerCase()] || '○';
  }

  function confidenceClass(conf) {
    const c = (conf || '').toLowerCase();
    if (c === 'high')        return 'conf-high';
    if (c === 'medium')      return 'conf-medium';
    if (c === 'low')         return 'conf-low';
    if (c === 'speculative') return 'conf-speculative';
    return 'conf-none';
  }

  function esc(s) {
    return String(s || '')
      .replace(/&/g,'&amp;').replace(/</g,'&lt;')
      .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  // ── Render ─────────────────────────────────────────────────────────────────
  function renderSidebar(inc) {
    // ID
    document.getElementById('sb-id').textContent = inc.id || '';

    // Sources
    const srcEl = document.getElementById('sb-sources');
    const sources = inc.sources || [];
    if (sources.length === 0) {
      srcEl.innerHTML = '<div style="font-size:12px;color:var(--muted)">No sources</div>';
    } else {
      srcEl.innerHTML = sources.map(s => {
        const cls = s.status === 'ok' ? 'src-ok' : s.status === 'timeout' ? 'src-timeout' : 'src-err';
        return `<div class="source-row">
          <span class="src-dot ${cls}"></span>
          <span class="src-name">${esc(s.name)}</span>
          <span class="src-counts">${s.eventCount || 0}ev / ${s.signalCount || 0}sig</span>
        </div>`;
      }).join('');
    }

    // Verdict
    const vEl = document.getElementById('sb-verdict');
    const verdict = inc.verdict;
    if (!verdict || (verdict.noTriggerFound && (!verdict.hypotheses || verdict.hypotheses.length === 0))) {
      vEl.innerHTML = `<div class="verdict-card"><div class="no-verdict">No clear trigger identified.</div></div>`;
      return;
    }

    const hyps = verdict.hypotheses || [];
    const eventIndex = {};
    (inc.events || []).forEach(ev => { eventIndex[ev.id] = ev; });

    const cards = hyps.slice(0, 3).map((h, i) => {
      const confCls = confidenceClass(h.confidence);
      const triggerEv = eventIndex[h.triggerEventId];
      const triggerTitle = triggerEv ? triggerEv.title : (h.triggerEventId || 'Unknown trigger');
      const rules = (h.ruleIds || []).map(r => `<span class="rule-chip">${esc(r)}</span>`).join('');
      const chain = (h.chain || []).map(c => `<li>${esc(c.description)}</li>`).join('');
      const chainHtml = chain ? `<ul class="chain-list">${chain}</ul>` : '';

      return `<div class="verdict-card" style="${i > 0 ? 'margin-top:8px;opacity:0.7' : ''}">
        <div class="verdict-header">
          <span class="confidence-badge ${confCls}">${esc(h.confidence)}</span>
          <span style="font-size:11px;color:var(--muted)">Hypothesis ${i + 1}</span>
        </div>
        <div class="verdict-body">
          <div class="trigger-label">Trigger</div>
          <div class="trigger-title">${esc(triggerTitle)}</div>
          ${h.explanation ? `<div class="verdict-explanation">${esc(h.explanation)}</div>` : ''}
          ${rules ? `<div class="rules-row">${rules}</div>` : ''}
          ${chainHtml}
        </div>
      </div>`;
    }).join('');

    vEl.innerHTML = cards || `<div class="no-verdict">No hypotheses generated.</div>`;
  }

  function renderMain(inc) {
    document.getElementById('main-title').textContent = inc.id || 'Incident';

    const w = inc.window || {};
    const from = w.from ? fmtTime(w.from) : '?';
    const to   = w.to   ? fmtTime(w.to)   : '?';
    const ns   = (inc.scope && inc.scope.namespaces && inc.scope.namespaces.length)
                   ? inc.scope.namespaces.join(', ') : '';
    document.getElementById('main-window').textContent =
      `${from}  →  ${to}` + (ns ? `   ·   namespace: ${ns}` : '');

    // Anomalies from signals
    const anomalies = [];
    (inc.signals || []).forEach(sig => {
      (sig.changePoints || []).forEach(cp => {
        if (cp.score >= 0.4) {
          anomalies.push({ sig, cp });
        }
      });
    });
    anomalies.sort((a, b) => b.cp.score - a.cp.score);

    const aSec = document.getElementById('anomalies-section');
    const aGrid = document.getElementById('anomaly-grid');
    if (anomalies.length > 0) {
      aSec.style.display = '';
      aGrid.innerHTML = anomalies.slice(0, 12).map(({ sig, cp }) => {
        const dir = cp.direction === 'up' ? '↑' : cp.direction === 'down' ? '↓' : '~';
        const mag = cp.magnitude ? `${cp.magnitude.toFixed(1)}×` : '';
        const conf = Math.round((cp.score || 0) * 100);
        const entityShort = (sig.entityId || '').split('/').pop();
        return `<div class="anomaly-card">
          <div class="anomaly-metric">${esc(sig.metric)}</div>
          <div class="anomaly-entity">${esc(sig.entityId)}</div>
          <div class="anomaly-stats">
            <div class="anomaly-stat"><strong>${dir}${mag}</strong> magnitude</div>
            <div class="anomaly-stat"><strong>${conf}%</strong> confidence</div>
            <div class="anomaly-stat"><strong>${esc(sig.unit || '')}</strong></div>
          </div>
        </div>`;
      }).join('');
    } else {
      aSec.style.display = 'none';
    }

    // Timeline: merge events + anomalies, sort by time
    const timelineItems = [];

    (inc.events || []).forEach(ev => {
      timelineItems.push({ t: new Date(ev.at), type: 'event', data: ev });
    });
    (inc.signals || []).forEach(sig => {
      (sig.changePoints || []).forEach(cp => {
        if (cp.score >= 0.3) {
          timelineItems.push({ t: new Date(cp.at), type: 'anomaly', data: { sig, cp } });
        }
      });
    });
    timelineItems.sort((a, b) => a.t - b.t);

    const tl = document.getElementById('timeline');
    if (timelineItems.length === 0) {
      tl.innerHTML = '<li style="color:var(--muted);font-size:13px;padding:12px 0">No events in this window.</li>';
      return;
    }

    tl.innerHTML = timelineItems.map(item => {
      if (item.type === 'event') {
        const ev = item.data;
        const svgCls = severityClass(ev.severity);
        return `<li class="tl-item">
          <span class="tl-time">${fmtTime(ev.at)}</span>
          <span class="tl-icon">${kindIcon(ev.kind)}</span>
          <div class="tl-body">
            <div class="tl-title ${svgCls}">${esc(ev.title)}</div>
            <div class="tl-entity">${esc(ev.entityId)}</div>
            ${ev.detail ? `<div class="tl-detail">${esc(ev.detail.split('\n')[0])}</div>` : ''}
          </div>
        </li>`;
      } else {
        const { sig, cp } = item.data;
        const dir = cp.direction === 'up' ? '↑' : cp.direction === 'down' ? '↓' : '~';
        const mag = cp.magnitude ? `${cp.magnitude.toFixed(1)}×` : '';
        const conf = Math.round((cp.score || 0) * 100);
        return `<li class="tl-item">
          <span class="tl-time">${fmtTime(cp.at)}</span>
          <span class="tl-icon sev-notable">▲</span>
          <div class="tl-body">
            <div class="tl-title sev-notable">Anomaly: ${dir}${mag} ${esc(sig.metric)} (${conf}% confidence)</div>
            <div class="tl-entity">${esc(sig.entityId)}</div>
          </div>
        </li>`;
      }
    }).join('');
  }

  // ── Fetch and bootstrap ────────────────────────────────────────────────────
  fetch('/api/incident')
    .then(r => {
      if (!r.ok) throw new Error(`HTTP ${r.status}`);
      return r.json();
    })
    .then(inc => {
      document.getElementById('loading-screen').style.display = 'none';
      document.getElementById('content').style.display = '';
      renderSidebar(inc);
      renderMain(inc);
    })
    .catch(err => {
      document.getElementById('loading-screen').style.display = 'none';
      document.getElementById('error-screen').style.display = '';
      document.getElementById('error-msg').textContent =
        'Failed to load incident: ' + err.message;
    });
})();
</script>
</body>
</html>
